configuration:
  swap_size:
    name: "Taille du swap (Mo)"
    description: "Taille du fichier d'échange, de 256 à 8192 Mo."
  swap_location:
    name: "Emplacement du swap"
    description: "Dossier qui contient le fichier d'échange. Gardez « backup » : c'est le seul jamais copié dans les sauvegardes."
  swap_folder:
    name: "Sous-dossier (facultatif)"
    description: "Sous-dossier de l'emplacement, par exemple le nom d'un disque USB dans media. Il doit déjà exister."
