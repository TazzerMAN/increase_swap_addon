configuration:
  swap_size:
    name: "Swap size (MB)"
    description: "Size of the swap file, from 256 to 8192 MB."
  swap_location:
    name: "Swap location"
    description: "Folder that holds the swap file. Keep \"backup\": it is the only one never copied into backups."
  swap_folder:
    name: "Subfolder (optional)"
    description: "Subfolder of the swap location, for instance the name of a USB drive under media. It must already exist."
