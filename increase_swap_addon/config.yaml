name: "Increase Swap"
version: "1.3.0"
slug: increase_swap_addon
description: "This add-on increases the swap space on your system."
url: "https://github.com/TazzerMAN/increase_swap_addon"
image: "ghcr.io/tazzerman/increase_swap_addon-{arch}"
arch:
  - amd64
  - armv7
  - aarch64
startup: services
boot: "auto"
init: false
options:
  swap_size: 2048
  swap_location: "backup"
schema:
  swap_size: int(256,8192)
  swap_location: list(backup|share|media|addons)
privileged:
  - SYS_ADMIN
map:
  - addons:rw
  - media:rw
  - share:rw
  - backup:rw