# https://developers.home-assistant.io/docs/apps/configuration
name: "Increase Swap"
version: "1.4.1"
slug: increase_swap_addon
description: "Adds a swap file to Home Assistant OS, sized and placed from the app options."
url: "https://github.com/TazzerMAN/increase_swap_addon"
arch:
  - aarch64
  - amd64
image: "ghcr.io/tazzerman/increase_swap_addon"
startup: services
boot: auto
init: false
options:
  swap_size: 2048
  swap_location: "backup"
schema:
  swap_size: int(256,8192)
  swap_location: list(backup|share|media|addons)
privileged:
  - SYS_ADMIN
map:
  # local_apps replaces the legacy "addons" map type; the path keeps the
  # historical /addons mount so existing swap files are still found.
  - type: local_apps
    read_only: false
    path: /addons
  - type: media
    read_only: false
  - type: share
    read_only: false
  - type: backup
    read_only: false
